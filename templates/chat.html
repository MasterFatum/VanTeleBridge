<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Tuco Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 20px;
            background-color: #1565c0;
            color: white;
            margin: 0;
            padding: 0;
        }
        .video-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px auto;
            max-width: 1400px;
            flex-wrap: nowrap;
            flex-direction: row;
            align-items: center;
            overflow: hidden;
        }
        .video-box {
            width: 640px;
            height: 480px;
            border: 2px solid #0d47a1;
            border-radius: 12px;
            overflow: hidden;
            background-color: #42a5f5;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            position: relative;
            flex: 1 1 640px;
        }
        .video-box video,
        .video-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
            font-weight: bold;
        }
        .volume-control {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .volume-control input[type="range"] {
            width: 100px;
            cursor: pointer;
        }
        .volume-control button {
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .volume-control button:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }
        h1 {
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        button:hover {
            background-color: #1565c0;
            filter: brightness(1.1);
        }
        .btn-default { background-color: #1976d2; }
        .btn-danger { background-color: #d32f2f; }
        .btn-danger:hover { background-color: #b71c1c; }
        .controls {
            margin: 15px;
        }
        #status {
            color: #bbdefb;
            font-size: 16px;
            margin-top: 10px;
        }
        #timer {
            font-size: 18px;
            font-weight: bold;
            color: #4fc3f7;
            margin: 5px;
        }

        /* Анимация поиска */
        .loading {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4fc3f7;
            margin: 0 4px;
            animation: blink 1.4s infinite both;
        }
        .loading:nth-child(2) { animation-delay: 0.2s; }
        .loading:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        .loading-container {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-style: italic;
            color: #4fc3f7;
        }
        .country-select {
            margin: 10px 0;
            padding: 8px 12px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            cursor: pointer;
            max-width: 300px;
            width: 100%;
        }
        .country-select:focus {
            outline: none;
            box-shadow: 0 0 0 2px #4fc3f7;
        }
    </style>
</head>
<body>
    <h1>Tuco Chat</h1>

    <div class="video-container">
        <!-- Ваше видео -->
        <div class="video-box">
            <video id="localVideo" autoplay muted></video>
            <div class="video-label">Вы</div>
        </div>

        <!-- Видео собеседника ИЛИ GIF -->
        <div class="video-box">
            <img id="remotePlaceholder" src="/static/loading.gif" alt="Ожидание собеседника..." style="display: block;">
            <video id="remoteVideo" autoplay style="display: none;"></video>
            <div class="video-label">Собеседник</div>
            <div class="volume-control" id="volumeControl">
                <span>🔊</span>
                <input type="range" id="volumeSlider" min="0" max="2" step="0.1" value="1">
                <button id="toggleCameraBtn" onclick="toggleRemoteCamera()" style="background: none; border: none; color: white; font-size: 18px; cursor: pointer; padding: 2px 6px;">📷</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <div style="margin: 10px 0;">
            <label for="countrySelect" style="display: block; margin-bottom: 5px; font-size: 14px; color: #bbdefb;">Выберите страну для поиска:</label>
            <select id="countrySelect" class="country-select">
                <option value="any">🌍 Любая страна</option>
                <option value="am">🇦🇲 Армения</option>
                <option value="de">🇩🇪 Германия</option>
                <option value="gb">🇬🇧 Великобритания</option>
                <option value="ge">🇬🇪 Грузия</option>
                <option value="kz">🇰🇿 Казахстан</option>
                <option value="cn">🇨🇳 Китай</option>
                <option value="lv">🇱🇻 Латвия</option>
                <option value="lt">🇱🇹 Литва</option>
                <option value="pl">🇵🇱 Польша</option>
                <option value="ru">🇷🇺 Россия</option>
                <option value="us">🇺🇸 США</option>
                <option value="tr">🇹🇷 Турция</option>
                <option value="ua">🇺🇦 Украина</option>
                <option value="fi">🇫🇮 Финляндия</option>
                <option value="fr">🇫🇷 Франция</option>
                <option value="ee">🇪🇪 Эстония</option>
            </select>
        </div>
        <div style="margin: 10px 0;">
            <label for="genderSelect" style="display: block; margin-bottom: 5px; font-size: 14px; color: #bbdefb;">Пол собеседника:</label>
            <select id="genderSelect" class="country-select">
                <option value="any">Любой пол</option>
                <option value="male">Мужчина</option>
                <option value="female">Женщина</option>
            </select>
        </div>

        <button onclick="toggleSearch()" id="findButton" class="btn-default">🔍 Поиск собеседника</button>
        <button onclick="toggleMicrophone()" id="micButton" class="btn-default">🎤 Микрофон: Вкл</button>
        <button onclick="toggleRemoteAudio()" id="audioButton" class="btn-default">🔊 Звук: Вкл</button>
        <button onclick="hangup()" id="hangupButton" style="display: none;">📞 Завершить</button>
        <div id="status">🎥 Камера включается...</div>
        <div id="timer" style="display: none;">⏱ Время разговора: 00:00</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const remotePlaceholder = document.getElementById('remotePlaceholder');
        const findButton = document.getElementById('findButton');
        const hangupButton = document.getElementById('hangupButton');
        const micButton = document.getElementById('micButton');
        const audioButton = document.getElementById('audioButton');
        const statusDiv = document.getElementById('status');
        const timerDiv = document.getElementById('timer');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeControl = document.getElementById('volumeControl');

        let localStream;
        let remoteStream;
        let peerConnection;
        let socket;

        let isMicrophoneEnabled = true;
        let isRemoteAudioEnabled = true;

        let timerInterval = null;
        let startTime = null;

        let isSearching = false;
        let currentTargetSid = null;

        volumeSlider.addEventListener('input', () => {
            remoteVideo.volume = parseFloat(volumeSlider.value);
        });

        const servers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun.cloudflare.com:3478' },
                { urls: 'stun:stun.voip.google.com:3478' }
            ]
        };

        window.addEventListener('load', () => {
            getLocalStream();
        });

        async function getLocalStream() {
            try {
                if (!localStream) {
                    statusDiv.innerText = '🎥 Разрешите доступ к камере и микрофону...';
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    localVideo.srcObject = localStream;
                    statusDiv.innerText = '✅ Камера включена. Нажмите «Поиск собеседника», чтобы начать.';
                    isMicrophoneEnabled = true;
                    localStream.getAudioTracks().forEach(track => {
                        track.enabled = true;
                    });
                    updateMicButton();
                }
            } catch (err) {
                statusDiv.innerText = '❌ Ошибка доступа к камере: разрешите доступ';
                findButton.disabled = false;
                console.error('getUserMedia error:', err);
            }
        }

        function updateMicButton() {
            if (isMicrophoneEnabled) {
                micButton.innerHTML = '🎤 Микрофон: Вкл';
                micButton.className = 'btn-default';
            } else {
                micButton.innerHTML = '🚫 Микрофон: Выкл';
                micButton.className = 'btn-danger';
            }
        }

        function toggleSearch() {
            if (isSearching) {
                stopSearch();
            } else {
                startSearch();
            }
        }

        function startSearch() {
            if (!localStream) {
                statusDiv.innerText = '❌ Сначала разрешите доступ к камере!';
                return;
            }
            statusDiv.innerHTML = '<div class="loading-container">Поиск собеседника<span class="loading"></span><span class="loading"></span><span class="loading"></span></div>';
            findButton.innerHTML = '🛑 Завершить поиск';
            findButton.className = 'btn-danger';
            isSearching = true;

            connectAndFindPartner();
        }

        function stopSearch() {
            if (socket) {
                socket.off('connect_with');
                socket.off('status');
                socket.off('signal');
                socket.disconnect();
            }
            socket = null;
            statusDiv.innerText = '🔍 Поиск остановлен.';
            findButton.innerHTML = '🔍 Поиск собеседника';
            findButton.className = 'btn-default';
            findButton.disabled = false;
            isSearching = false;
        }

        function connectAndFindPartner() {
            socket = io(window.location.origin, {
                transports: ['polling']
            });


            const selectedCountry = document.getElementById('countrySelect').value;
            const selectedGender = document.getElementById('genderSelect').value;

            socket.on('status', (msg) => {
                statusDiv.innerText = msg;
            });

            socket.on('connect_with', (data) => {
                statusDiv.innerText = '✅ Собеседник найден!';
                hangupButton.style.display = 'inline-block';
                timerDiv.style.display = 'block';
                startTimer();
                currentTargetSid = data.target;
                startCall(data.target);
                isSearching = false;
                findButton.innerHTML = '🔍 Поиск собеседника';
                findButton.className = 'btn-default';
                findButton.disabled = true;
            });

            socket.on('signal', (data) => {
                console.log('Signal received:', data);
                handleSignal(data);
            });

            socket.emit('find_partner', { country: selectedCountry, gender: selectedGender });
        }

        function startTimer() {
            startTime = new Date();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = new Date();
                const diff = new Date(now - startTime);
                const min = String(diff.getUTCMinutes()).padStart(2, '0');
                const sec = String(diff.getUTCSeconds()).padStart(2, '0');
                timerDiv.innerText = `⏱ Время разговора: ${min}:${sec}`;

                if (now - startTime >= 12 * 60 * 1000) {
                    statusDiv.innerText = '⏰ Время разговора истекло. Поиск нового собеседника...';
                    hangup();
                    setTimeout(() => {
                        if (!isSearching) toggleSearch();
                    }, 2000);
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timerDiv.innerText = '⏱ Время разговора: 00:00';
            timerDiv.style.display = 'none';
        }

        async function startCall(targetSid) {
            peerConnection = new RTCPeerConnection(servers);
            remoteStream = new MediaStream();
            remoteVideo.srcObject = remoteStream;

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                event.streams[0].getTracks().forEach(track => {
                    remoteStream.addTrack(track);
                });
                // ✅ Подключили видео — скрываем GIF
                remotePlaceholder.style.display = 'none';
                remoteVideo.style.display = 'block';

            };

            peerConnection.onicecandidate = (event) => {
                console.log('ICE candidate:', event.candidate);
                if (event.candidate) {
                    socket.emit('signal', {
                        target: targetSid,
                        payload: { type: 'ice', candidate: event.candidate }
                    });
                    console.log('ICE candidate отправлен');
                }
            };

            peerConnection.oniceconnectionstatechange = () => {
                console.log('ICE state:', peerConnection.iceConnectionState);
            };

            peerConnection.ontrack = (event) => {
                console.log('Track received:', event.track.kind, event.track.id);
                event.streams[0].getTracks().forEach(track => {
                    remoteStream.addTrack(track);
                });
                // ✅ Подключили видео — скрываем GIF
                remotePlaceholder.style.display = 'none';
                remoteVideo.style.display = 'block';
            };

            try {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                // Отправляем offer сразу
                socket.emit('signal', {
                    target: targetSid,
                    payload: { type: 'offer', sdp: offer }
                });
                console.log('Offer отправлен');
            } catch (err) {
                console.error('Ошибка при создании offer:', err);
            }
        }

        async function handleSignal(data) {
            // Backend отправляет {payload: {...}}, распаковываем
            const signal = data.payload || data;
            console.log('handleSignal called, type:', signal.type, 'peerConnection:', !!peerConnection);
            if (!peerConnection) return;

            try {
                if (signal.type === 'offer') {
                    console.log('Processing offer');
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                    console.log('Remote description set');
                    const answer = await peerConnection.createAnswer();
                    console.log('Answer created');
                    await peerConnection.setLocalDescription(answer);
                    console.log('Local description set');

                    // Отправляем answer сразу
                    socket.emit('signal', {
                        target: currentTargetSid,
                        payload: { type: 'answer', sdp: answer }
                    });
                    console.log('Answer отправлен');
                } else if (signal.type === 'answer') {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                } else if (signal.type === 'ice') {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate));
                }
            } catch (err) {
                console.error('Ошибка обработки сигнала:', err);
            }
        }

        function toggleMicrophone() {
            if (!localStream) return;

            isMicrophoneEnabled = !isMicrophoneEnabled;
            localStream.getAudioTracks().forEach(track => {
                track.enabled = isMicrophoneEnabled;
            });

            if (isMicrophoneEnabled) {
                micButton.innerHTML = '🎤 Микрофон: Вкл';
                micButton.className = 'btn-default';
            } else {
                micButton.innerHTML = '🚫 Микрофон: Выкл';
                micButton.className = 'btn-danger';
            }
        }

        function toggleRemoteAudio() {
            if (!remoteStream) return;

            isRemoteAudioEnabled = !isRemoteAudioEnabled;

            remoteStream.getAudioTracks().forEach(track => {
                track.enabled = isRemoteAudioEnabled;
            });

            if (isRemoteAudioEnabled) {
                audioButton.innerHTML = '🔊 Звук: Вкл';
                audioButton.className = 'btn-default';
            } else {
                audioButton.innerHTML = '🔇 Звук: Выкл';
                audioButton.className = 'btn-danger';
            }
        }

        function toggleRemoteCamera() {
            if (remoteVideo.style.display === 'none') {
                remoteVideo.style.display = 'block';
                remotePlaceholder.style.display = 'none';
            } else {
                remoteVideo.style.display = 'none';
                remotePlaceholder.style.display = 'block';
            }
        }

        function hangup() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (socket) {
                socket.off('connect_with');
                socket.off('signal');
                socket.off('status');
                socket.disconnect();
                socket = null;
            }

            remoteVideo.srcObject = null;
            remoteVideo.style.display = 'none';
            remoteVideo.volume = 1;
            volumeSlider.value = 1;
            remotePlaceholder.style.display = 'block';
            currentTargetSid = null;


            hangupButton.style.display = 'none';
            findButton.disabled = false;
            statusDiv.innerText = '👋 Собеседник отключён. Нажмите «Поиск собеседника» для нового поиска.';
            resetTimer();
        }
    </script>
</body>
</html>
